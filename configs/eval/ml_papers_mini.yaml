name: "ml_papers_mini"
description: "Mini evaluation benchmark for ML Papers v1 dev set (10 questions)"
pipeline:
  chunker:
    strategy: "recursive"
    chunk_size: 512
    chunk_overlap: 64
  retriever:
    top_k: 5
  generator:
    model: "qwen/qwen3.8-27b"
    reasoning_model: "qwen/qwen3.8-27b"
eval:
  datasets: ["ml_papers_v1"]
  judge_model: "qwen/qwen3.8-27b"
  bootstrap_n: 100
  permutation_n: 1000
  seed: 42
