name: "baseline_squad_only"
description: "Baseline configuration evaluating only SQuAD v2 dev 200"
pipeline:
  chunker:
    strategy: "recursive"
    chunk_size: 512
    chunk_overlap: 64
  retriever:
    top_k: 5
  generator:
    model: "qwen/qwen3.8-27b"
    reasoning_model: "qwen/qwen3.8-27b"
eval:
  datasets: ["squad_v2_dev_200"]
  judge_model: "qwen/qwen3.8-27b"
  bootstrap_n: 1000
  permutation_n: 10000
  seed: 42
