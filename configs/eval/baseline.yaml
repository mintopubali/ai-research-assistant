name: "baseline"
description: "Current production defaults: recursive chunker, Qwen 3.8 27B answer model and judge model."
pipeline:
  chunker:
    strategy: "recursive"
    chunk_size: 512
    chunk_overlap: 64
  retriever:
    top_k: 5
  generator:
    model: "qwen/qwen3.8-27b"
    reasoning_model: "qwen/qwen3.8-27b"
eval:
  datasets: ["squad_v2_dev_200", "ml_papers_v1"]
  judge_model: "qwen/qwen3.8-27b"
  bootstrap_n: 1000
  permutation_n: 10000
  seed: 42
